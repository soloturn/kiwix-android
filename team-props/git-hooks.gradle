static def isLinuxOrMacOs() {
  def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
  return osName.contains('linux') || osName.contains('mac os') || osName.contains('macos')
}

// Compute once and share - avoids 5 racing subprocess spawns under --parallel.
// providers.exec (not raw .execute()) so this survives the configuration cache.
if (!rootProject.hasProperty('resolvedGitHooksDirProvider')) {
  rootProject.ext.resolvedGitHooksDirProvider = providers.exec {
    commandLine 'git', 'rev-parse', '--path-format=absolute', '--git-path', 'hooks'
  }.standardOutput.asText.map { it.trim() }
}
def gitHooksDirProvider = rootProject.resolvedGitHooksDirProvider

task copyGitHooks(type: Copy) {
  description = 'Copies the git hooks from team-props/git-hooks to the .git folder.'
  from("${rootDir}/team-props/git-hooks/") {
    include '**/*.sh'
    rename '(.*).sh', '$1'
  }
  into gitHooksDirProvider
}

task installGitHooks {
  description = 'Installs the pre-commit git hooks from team-props/git-hooks.'
  group = 'git hooks'
  onlyIf { isLinuxOrMacOs() }
  dependsOn copyGitHooks
  doLast {
    providers.exec {
      commandLine 'chmod', '-R', '+x', gitHooksDirProvider.get()
    }.result.get()
    logger.info('Git hook installed successfully.')
  }
}

afterEvaluate {
  tasks.named('preBuild').configure {
    dependsOn installGitHooks
  }
}
