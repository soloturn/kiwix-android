name: Android Emulator Test
description: Run tests on an Android emulator, retrying up to 3 times on a fresh boot each time

inputs:
  api-level:
    description: Android API level
    required: true

  target:
    description: Android emulator target
    required: true

  arch:
    description: Android emulator architecture
    required: true

  profile:
    description: Android emulator profile
    required: true

  script:
    description: Script to execute after the emulator starts
    required: true

  ram-size:
    description: Emulator RAM size
    required: false
    default: 4096M

  cores:
    description: Number of emulator CPU cores
    required: false
    default: "4"

  heap-size:
    description: Emulator heap size
    required: false
    default: 1024M

  gradle-opts:
    description: Value for the GRADLE_OPTS environment variable during the emulator script
    required: false
    default: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000"

runs:
  using: composite

  steps:

    - name: Emulator test - attempt 1
      id: attempt-1
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
        ANDROID_EMULATOR_SCRIPT: ${{ inputs.script }}
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        profile: ${{ inputs.profile }}
        ram-size: ${{ inputs.ram-size }}
        cores: ${{ inputs.cores }}
        heap-size: ${{ inputs.heap-size }}
        # ANGLE over SwiftShader's Vulkan backend supports WebView GLES 3.1/3.2.
        emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        sdcard-path-or-size: 1024M
        disable-animations: true
        force-avd-creation: false
        emulator-boot-timeout: 1200
        script: |
          # The emulator's crashpad_handler subprocess can survive `adb emu kill` and
          # hang the android-emulator-runner action's teardown
          # (https://github.com/ReactiveCircus/android-emulator-runner/issues/385).
          # Kill it after the emulator shutdown starts; it can otherwise keep
          # the runner action waiting for the emulator process indefinitely.
          trap '(sleep 30; while pgrep -x crashpad_handler >/dev/null 2>&1; do echo "crashpad_handler: still running, killing"; pkill -9 crashpad_handler || true; sleep 5; done; echo "crashpad_handler: gone") &' EXIT
          bash -c "$ANDROID_EMULATOR_SCRIPT"

    # The emulator runner installs the SDK emulator package on every attempt. A failed
    # download (dl.google.com) otherwise burns all attempts within seconds, so back off.
    - name: Wait before attempt 2
      if: steps.attempt-1.outcome == 'failure'
      shell: bash
      run: sleep 60

    - name: Emulator test - attempt 2
      id: attempt-2
      if: steps.attempt-1.outcome == 'failure'
      continue-on-error: true
      uses: reactivecircus/android-emulator-runner@v2
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
        ANDROID_EMULATOR_SCRIPT: ${{ inputs.script }}
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        profile: ${{ inputs.profile }}
        ram-size: ${{ inputs.ram-size }}
        cores: ${{ inputs.cores }}
        heap-size: ${{ inputs.heap-size }}
        emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        sdcard-path-or-size: 1024M
        disable-animations: true
        force-avd-creation: true
        emulator-boot-timeout: 1200
        script: |
          trap '(sleep 30; while pgrep -x crashpad_handler >/dev/null 2>&1; do echo "crashpad_handler: still running, killing"; pkill -9 crashpad_handler || true; sleep 5; done; echo "crashpad_handler: gone") &' EXIT
          bash -c "$ANDROID_EMULATOR_SCRIPT"

    - name: Wait before attempt 3
      if: steps.attempt-2.outcome == 'failure'
      shell: bash
      run: sleep 180

    - name: Emulator test - attempt 3
      id: attempt-3
      if: steps.attempt-2.outcome == 'failure'
      uses: reactivecircus/android-emulator-runner@v2
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60
        ANDROID_EMULATOR_SCRIPT: ${{ inputs.script }}
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        profile: ${{ inputs.profile }}
        ram-size: ${{ inputs.ram-size }}
        cores: ${{ inputs.cores }}
        heap-size: ${{ inputs.heap-size }}
        emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        sdcard-path-or-size: 1024M
        disable-animations: true
        force-avd-creation: true
        emulator-boot-timeout: 1200
        script: |
          trap '(sleep 30; while pgrep -x crashpad_handler >/dev/null 2>&1; do echo "crashpad_handler: still running, killing"; pkill -9 crashpad_handler || true; sleep 5; done; echo "crashpad_handler: gone") &' EXIT
          bash -c "$ANDROID_EMULATOR_SCRIPT"

    # ---------------------------------------------------------
    # Final result
    #
    # Important:
    # If the script started and failed, this is a genuine test
    # failure. If all emulator startup retries failed, fail too.
    # ---------------------------------------------------------
    - name: Fail if emulator/test failed
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.attempt-1.outcome }}" = "success" ]; then
          exit 0
        fi

        if [ "${{ steps.attempt-2.outcome }}" = "success" ]; then
          exit 0
        fi

        if [ "${{ steps.attempt-3.outcome }}" = "success" ]; then
          exit 0
        fi

        echo "Android emulator test failed."
        exit 1
