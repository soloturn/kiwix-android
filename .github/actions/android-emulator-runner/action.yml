name: Android Emulator Test
description: Run tests on an Android emulator, bounded by a timeout instead of an unbounded hang

inputs:
  api-level:
    description: Android API level
    required: true

  target:
    description: Android emulator target
    required: true

  arch:
    description: Android emulator architecture
    required: true

  profile:
    description: Android emulator profile
    required: true

  script:
    description: Script to execute after the emulator starts
    required: true

  ram-size:
    description: Emulator RAM size
    required: false
    default: 4096M

  cores:
    description: Number of emulator CPU cores
    required: false
    default: "4"

  heap-size:
    description: Emulator heap size
    required: false
    default: 1024M

  gradle-opts:
    description: Value for the GRADLE_OPTS environment variable during the emulator script
    required: false
    default: ""

  timeout-minutes:
    description: >
      Maximum time the emulator step may run before it's killed. Backstops
      reactivecircus/android-emulator-runner hangs (e.g. its teardown never
      returning because the emulator's crashpad_handler subprocess survives
      `adb emu kill` and keeps the step's output pipe open - see
      https://github.com/ReactiveCircus/android-emulator-runner/issues/385)
      that would otherwise silently eat the full GitHub Actions default
      6-hour job timeout. Sized above the slowest legitimately-passing runs
      observed on this repo's shared runners (up to ~2h), not the normal
      case (typically well under 30m).
    required: false
    default: "180"

runs:
  using: composite

  steps:
    - name: Emulator test
      timeout-minutes: ${{ fromJSON(inputs.timeout-minutes) }}
      uses: reactivecircus/android-emulator-runner@v2
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        ADB_INSTALL_TIMEOUT: "12"
      with:
        api-level: ${{ inputs.api-level }}
        target: ${{ inputs.target }}
        arch: ${{ inputs.arch }}
        profile: ${{ inputs.profile }}
        ram-size: ${{ inputs.ram-size }}
        cores: ${{ inputs.cores }}
        heap-size: ${{ inputs.heap-size }}
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        sdcard-path-or-size: 1024M
        disable-animations: true
        force-avd-creation: false
        emulator-boot-timeout: 1200
        script: |
          bash -c '${{ inputs.script }}'
