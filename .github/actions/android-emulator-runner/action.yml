name: Android Emulator Runner
description: Boot the emulator (retrying on boot failure) and run a script, with a reliable teardown

inputs:
  api-level:
    description: Android API level
    required: true

  target:
    description: Android emulator target
    required: true

  arch:
    description: Android emulator architecture
    required: true

  profile:
    description: Android emulator profile
    required: true

  script:
    description: Script to execute after the emulator starts
    required: false
    default: echo "Generated AVD snapshot for caching."

  ram-size:
    description: Emulator RAM size
    required: false
    default: 4096M

  cores:
    description: Number of emulator CPU cores
    required: false
    default: "4"

  heap-size:
    description: Emulator heap size
    required: false
    default: 1024M

  sdcard-path-or-size:
    description: Emulator sdcard path or size
    required: false
    default: 1024M

  gradle-opts:
    description: Value for the GRADLE_OPTS environment variable during the script
    required: false
    default: ""

  max-attempts:
    description: Number of boot attempts before giving up
    required: false
    default: "3"

runs:
  using: composite

  steps:
    # ---------------------------------------------------------
    # `adb emu kill`'s "OK" doesn't guarantee the process exited, so this
    # kills by PID and waits on it instead of trusting the report. Retries
    # only a boot failure (script never started) - a started-then-failed
    # script is a genuine result, not retried. Attempt 1 reuses whatever
    # AVD/snapshot already exists; retries force a fresh cold boot.
    # ---------------------------------------------------------
    - name: Boot emulator and run script
      shell: bash
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        # ddmlib's install timeout defaults to 4 minutes; tripled for slow runners.
        ADB_INSTALL_TIMEOUT: "12"
      run: |
        set -uo pipefail

        AVD_NAME="test"
        PORT=5554
        SERIAL="emulator-${PORT}"
        MAX_ATTEMPTS=${{ inputs.max-attempts }}
        export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"

        sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        avdmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
        if [ ! -x "$sdkmanager_bin" ]; then
          echo "::error::sdkmanager not found at $sdkmanager_bin (ANDROID_HOME=$ANDROID_HOME)"
          exit 1
        fi
        yes | "$sdkmanager_bin" --licenses > /dev/null || true
        "$sdkmanager_bin" --install platform-tools emulator \
          "system-images;android-${{ inputs.api-level }};${{ inputs.target }};${{ inputs.arch }}" > /dev/null

        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        adb start-server

        script_exit=1
        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          echo "::group::Boot attempt ${attempt}/${MAX_ATTEMPTS}"

          if [ "$attempt" -gt 1 ] || [ ! -d "$ANDROID_AVD_HOME/${AVD_NAME}.avd" ]; then
            echo "Creating AVD."
            if ! echo no | "$avdmanager_bin" create avd --force -n "$AVD_NAME" \
              --path "$ANDROID_AVD_HOME/${AVD_NAME}.avd" \
              --package "system-images;android-${{ inputs.api-level }};${{ inputs.target }};${{ inputs.arch }}" \
              --device '${{ inputs.profile }}' --sdcard '${{ inputs.sdcard-path-or-size }}'; then
              echo "::error::avdmanager create avd failed"
              exit 1
            fi
            if [ ! -d "$ANDROID_AVD_HOME/${AVD_NAME}.avd" ]; then
              echo "::error::AVD dir missing at $ANDROID_AVD_HOME/${AVD_NAME}.avd after avdmanager reported success"
              ls -la "$ANDROID_AVD_HOME" || echo "(ANDROID_AVD_HOME itself does not exist)"
              exit 1
            fi
            {
              echo "hw.cpu.ncore=${{ inputs.cores }}"
              echo "hw.ramSize=${{ inputs.ram-size }}"
              echo "hw.heapSize=${{ inputs.heap-size }}"
            } >> "$ANDROID_AVD_HOME/${AVD_NAME}.avd/config.ini"
            snapshot_flag=-no-snapshot
          else
            snapshot_flag=-no-snapshot-save
          fi

          echo "Starting emulator."
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -port $PORT \
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics "$snapshot_flag" \
            > "/tmp/emulator-host-${attempt}.log" 2>&1 &
          emulator_pid=$!

          booted=false
          if timeout 60 adb -s "$SERIAL" wait-for-device; then
            for _ in $(seq 1 300); do
              if [ "$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                booted=true
                break
              fi
              sleep 2
            done
          fi

          script_started=false
          if [ "$booted" = true ]; then
            adb -s "$SERIAL" shell input keyevent 82
            adb -s "$SERIAL" shell settings put global window_animation_scale 0.0
            adb -s "$SERIAL" shell settings put global transition_animation_scale 0.0
            adb -s "$SERIAL" shell settings put global animator_duration_scale 0.0
            echo "::endgroup::"

            script_started=true
            echo "::group::Run script"
            set +e
            EMULATOR_PORT="$PORT" ANDROID_SERIAL="$SERIAL" bash -c '${{ inputs.script }}'
            script_exit=$?
            set -e
            echo "::endgroup::"
          else
            echo "Emulator did not become ready."
            echo "::endgroup::"
          fi

          # Ask for a graceful shutdown (saves a snapshot on a clean exit),
          # but don't trust it: give it 60s, then force-kill by PID and
          # wait for real exit - a hung shutdown must never hang the step.
          adb -s "$SERIAL" emu kill 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$emulator_pid" 2>/dev/null || break
            sleep 2
          done
          kill "$emulator_pid" 2>/dev/null || true
          wait "$emulator_pid" 2>/dev/null || true
          # Can survive `adb emu kill` on its own: ReactiveCircus/android-emulator-runner#385.
          killall -INT crashpad_handler 2>/dev/null || true

          if [ "$script_started" = true ]; then
            exit "$script_exit"
          fi
        done

        echo "Emulator failed to boot after ${MAX_ATTEMPTS} attempts."
        exit 1

    - name: Upload emulator host log on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: emulator-host-log-${{ github.job }}-${{ strategy.job-index }}
        path: /tmp/emulator-host-*.log
        if-no-files-found: ignore
