name: Android Emulator Test
description: Run tests on an Android emulator, retrying the boot on the known input-service race

inputs:
  api-level:
    description: Android API level
    required: true

  target:
    description: Android emulator target
    required: true

  arch:
    description: Android emulator architecture
    required: true

  profile:
    description: Android emulator profile
    required: true

  script:
    description: Script to execute after the emulator starts
    required: true

  ram-size:
    description: Emulator RAM size
    required: false
    default: 4096M

  cores:
    description: Number of emulator CPU cores
    required: false
    default: "3"

  heap-size:
    description: Emulator heap size
    required: false
    default: 1024M

  sdcard-path-or-size:
    description: Emulator sdcard path or size
    required: false
    default: 1024M

  gradle-opts:
    description: Value for the GRADLE_OPTS environment variable during the emulator script
    required: false
    default: ""

  max-attempts:
    description: Number of boot attempts before giving up
    required: false
    default: "4"

runs:
  using: composite

  steps:
    # ---------------------------------------------------------
    # Boots the emulator, waits for it to be ready, runs the test
    # script, and tears down - retrying the boot (not the test
    # script) up to max-attempts times.
    #
    # SDK installation and the initial AVD are handled by the
    # earlier "Create AVD and generate snapshot for caching" step
    # (uses: reactivecircus/android-emulator-runner@v2) - this step
    # only redoes AVD creation + launch, mirroring what that action
    # does internally, so we can retry it in a real loop instead of
    # one YAML block per attempt.
    #
    # Works around ReactiveCircus/android-emulator-runner#432 (input
    # keyevent outracing system_server after boot). Fixed upstream by
    # https://github.com/ReactiveCircus/android-emulator-runner/pull/495 -
    # once that's merged and released, this can likely go back to a
    # single reactivecircus/android-emulator-runner@v2 step.
    # ---------------------------------------------------------
    - name: Boot emulator and run test script
      shell: bash
      env:
        GRADLE_OPTS: ${{ inputs.gradle-opts }}
        # ddmlib's install timeout defaults to 4 minutes; tripled for slow runners.
        ADB_INSTALL_TIMEOUT: "12"
      run: |
        set -uo pipefail

        # Only exported by reactivecircus/android-emulator-runner's own SDK
        # install, which the "Create AVD..." step skips on an AVD cache hit -
        # the common case. Default to the path the AVD cache step itself uses.
        ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
        AVD_NAME="test"
        PORT=5554
        SERIAL="emulator-${PORT}"
        MAX_ATTEMPTS=${{ inputs.max-attempts }}

        kill_emulator() {
          adb -s "$SERIAL" emu kill 2>/dev/null || true
          kill "$emulator_pid" 2>/dev/null || true
          wait "$emulator_pid" 2>/dev/null || true
        }

        # Fixed cmdline-tools path (actions/runner-images).
        sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        avdmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
        if [ ! -x "$sdkmanager_bin" ]; then
          echo "::error::sdkmanager not found at $sdkmanager_bin (ANDROID_HOME=$ANDROID_HOME)"
          exit 1
        fi
        yes | "$sdkmanager_bin" --licenses > /dev/null || true
        "$sdkmanager_bin" --install platform-tools emulator \
          "system-images;android-${{ inputs.api-level }};${{ inputs.target }};${{ inputs.arch }}" > /dev/null

        export PATH="$ANDROID_HOME/platform-tools:$PATH"
        adb start-server

        # One-time host specs, to know what the emulator's cores/ram-size
        # inputs are actually competing against on this runner.
        echo "::group::Host diagnostics"
        echo "nproc: $(nproc)"
        free -h
        echo "::endgroup::"

        # Whether a userspace backtrace during a stall could ever be matched
        # against gfxstream/QEMU source, or would just be bare hex addresses -
        # the launcher binary is usually a thin wrapper, so check the actual
        # QEMU binary underneath it too, wherever this SDK version puts it.
        echo "::group::Emulator binary symbol check"
        qemu_bin="$(find "$ANDROID_HOME/emulator" -maxdepth 4 -type f -name 'qemu-system-*' 2>/dev/null | head -1)"
        for bin in "$ANDROID_HOME/emulator/emulator" "$qemu_bin"; do
          if [ -n "$bin" ] && [ -f "$bin" ]; then
            echo "--- $bin ---"
            file "$bin"
            echo "dynamic symbols: $(nm -D "$bin" 2>/dev/null | wc -l)"
            echo "full symbol table: $(nm "$bin" 2>/dev/null | wc -l)"
          else
            echo "--- $bin: not found ---"
          fi
        done
        echo "::endgroup::"

        for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
          echo "::group::Boot attempt ${attempt}/${MAX_ATTEMPTS}"

          # Attempt 1 reuses the AVD (and its cached snapshot) the earlier
          # "AVD cache"/"Create AVD and generate snapshot" steps warmed up.
          # Only force a genuinely fresh AVD + cold boot on retries, so we
          # don't discard that cache on the common, non-retried path.
          if [ "$attempt" -gt 1 ] || [ ! -d "$ANDROID_AVD_HOME/${AVD_NAME}.avd" ]; then
            echo "Creating AVD."
            echo no | "$avdmanager_bin" create avd --force -n "$AVD_NAME" \
              --package "system-images;android-${{ inputs.api-level }};${{ inputs.target }};${{ inputs.arch }}" \
              --device '${{ inputs.profile }}' --sdcard '${{ inputs.sdcard-path-or-size }}'
            {
              echo "hw.cpu.ncore=${{ inputs.cores }}"
              echo "hw.ramSize=${{ inputs.ram-size }}"
              echo "hw.heapSize=${{ inputs.heap-size }}"
            } >> "$ANDROID_AVD_HOME/${AVD_NAME}.avd/config.ini"
            snapshot_flag=-no-snapshot
          else
            snapshot_flag=-no-snapshot-save
          fi

          echo "Starting emulator."
          # swangle_indirect (ANGLE/Vulkan) replaces swiftshader_indirect,
          # whose GLES 3.0 cap crashed WebView's renderer on API 35/36.
          # Capture the emulator's own host-side output, not just the guest's logcat.
          "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -port $PORT \
            -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-metrics "$snapshot_flag" \
            > "/tmp/emulator-host-${attempt}.log" 2>&1 &
          emulator_pid=$!

          booted=false
          input_ready=false
          package_ready=false
          if timeout 60 adb -s "$SERIAL" wait-for-device; then
            for _ in $(seq 1 600); do
              if [ "$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                booted=true
                break
              fi
              sleep 2
            done
          fi

          # sys.boot_completed can flip to 1 before system_server has
          # finished publishing every service.
          service_ready() {
            result="$(adb -s "$SERIAL" shell service check "$1" 2>/dev/null)"
            echo "$result" | grep -q found && ! echo "$result" | grep -q "not found"
          }

          if [ "$booted" = true ]; then
            for _ in $(seq 1 15); do
              service_ready input && { input_ready=true; break; }
              sleep 1
            done
          fi

          if [ "$input_ready" = true ]; then
            for _ in $(seq 1 15); do
              service_ready package && { package_ready=true; break; }
              sleep 1
            done
          fi

          if [ "$booted" = true ] && [ "$input_ready" = true ] && [ "$package_ready" = true ]; then
            adb -s "$SERIAL" shell input keyevent 82
            adb -s "$SERIAL" shell settings put global window_animation_scale 0.0
            adb -s "$SERIAL" shell settings put global transition_animation_scale 0.0
            adb -s "$SERIAL" shell settings put global animator_duration_scale 0.0
            echo "::endgroup::"

            # Sample host load/memory and the emulator's own RSS every 20s
            # for the duration of the test script, to see whether failures
            # correlate with rising resource pressure over the run rather
            # than being uniformly distributed.
            : > /tmp/resource-diag.log
            (
              prev_iowait=0
              prev_total=0
              while true; do
                mem="$(free -m | awk 'NR==2 {printf "mem_used=%sMiB mem_avail=%sMiB", $3, $7}')"
                rss="$(ps -o rss= -p "$emulator_pid" 2>/dev/null | tr -d ' ')"
                # iowait_pct is the share of CPU time (summed across cores)
                # spent blocked on disk I/O since the previous sample - CPU
                # load/RSS/mem above can look idle while a native archive
                # open is actually stuck waiting on disk, not the CPU.
                read -r _ user nice system idle iowait irq softirq steal _ < /proc/stat
                total=$((user + nice + system + idle + iowait + irq + softirq + steal))
                iowait_pct=0
                if [ "$prev_total" -gt 0 ] && [ "$((total - prev_total))" -gt 0 ]; then
                  iowait_pct=$(( (iowait - prev_iowait) * 100 / (total - prev_total) ))
                fi
                prev_iowait=$iowait
                prev_total=$total
                echo "$(date -u +%FT%TZ) load=$(cut -d' ' -f1-3 /proc/loadavg) ${mem} emulator_rss=${rss}KiB iowait_pct=${iowait_pct}" >> /tmp/resource-diag.log
                ps -eo rss,comm --sort=-rss 2>/dev/null | head -6 >> /tmp/resource-diag.log
                # D-state (uninterruptible sleep) is the kernel-level signature of a
                # thread genuinely blocked on I/O or a futex, not just busy - a
                # direct check for "is the emulator itself stuck" vs. generic load.
                ps -L -o tid,stat,comm -p "$emulator_pid" 2>/dev/null | awk '$2 ~ /D/' >> /tmp/resource-diag.log
                sleep 20
              done
            ) &
            diag_pid=$!

            # Follow the host kernel's own log for the duration of the test
            # script. If a stall is a genuine kernel/scheduling-level event
            # (soft lockup, RCU stall, hung task), the kernel's own detectors
            # log it here - a much more authoritative signal than inferring
            # one from userspace symptoms.
            : > /tmp/dmesg.log
            sudo dmesg -w > /tmp/dmesg.log 2>&1 &
            dmesg_pid=$!

            # Cheap liveness probe (a trivial adb round-trip every 3s) instead
            # of tracing continuously. A no-op should return near-instantly;
            # if it takes several seconds, a stall is happening right now, so
            # capture a heavy, targeted snapshot at that exact moment - kernel
            # thread stacks and wait-channels for every emulator thread, plus
            # the tail of dmesg - rather than running that tracing for the
            # whole run. Debounced so one stall doesn't spam repeat captures.
            #
            # Run 35308243036 showed the echo probe alone missing a real
            # stall (88s logcat silence, host load 6.37, but adb echo always
            # under 5000ms). Also poll the guest's own load average, which
            # reflects contention an echo round-trip doesn't.
            : > /tmp/stall-capture.log
            (
              last_capture=0
              while true; do
                # %3N is unreliable across date implementations - diff full
                # nanoseconds (always exactly 9 digits, unambiguous) instead.
                start_ns=$(date +%s%N)
                timeout 8 adb -s "$SERIAL" shell echo ping > /dev/null 2>&1
                end_ns=$(date +%s%N)
                elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
                guest_load1=""
                guest_loadavg="$(timeout 5 adb -s "$SERIAL" shell cat /proc/loadavg 2>/dev/null)"
                guest_load1="$(echo "$guest_loadavg" | cut -d' ' -f1)"
                # Guest load past its own vCPU count means it's oversubscribed.
                guest_overloaded=false
                if [ -n "$guest_load1" ] && awk -v l="$guest_load1" -v c="${{ inputs.cores }}" 'BEGIN { exit !(l > c) }'; then
                  guest_overloaded=true
                fi
                now=$(date +%s)
                if { [ "$elapsed_ms" -gt 5000 ] || [ "$guest_overloaded" = true ]; } && [ $((now - last_capture)) -gt 15 ]; then
                  last_capture=$now
                  {
                    echo "=== stall detected at $(date -u +%FT%TZ), adb echo took ${elapsed_ms}ms, guest loadavg=[$guest_loadavg] ==="
                    echo "--- emulator thread states (tid/stat/wchan) ---"
                    ps -L -o tid,stat,wchan:32,comm -p "$emulator_pid" 2>/dev/null
                    echo "--- emulator thread kernel stacks ---"
                    for tid_dir in /proc/"$emulator_pid"/task/*; do
                      echo "tid $(basename "$tid_dir"):"
                      sudo cat "$tid_dir/stack" 2>/dev/null
                    done
                    echo "--- recent dmesg ---"
                    sudo dmesg -T 2>/dev/null | tail -80
                    echo "=== end stall capture ==="
                  } >> /tmp/stall-capture.log
                fi
                sleep 3
              done
            ) &
            stall_pid=$!

            echo "::group::Run test script"
            set +e
            EMULATOR_PORT="$PORT" ANDROID_SERIAL="$SERIAL" bash -c '${{ inputs.script }}'
            script_exit=$?
            set -e
            echo "::endgroup::"
            kill "$diag_pid" 2>/dev/null || true
            kill "$dmesg_pid" 2>/dev/null || true
            kill "$stall_pid" 2>/dev/null || true
            kill_emulator
            exit $script_exit
          fi

          echo "Emulator did not become ready (booted=${booted}, input_ready=${input_ready}, package_ready=${package_ready})."
          kill_emulator
          sleep 15
          echo "::endgroup::"
        done

        echo "Emulator failed to boot after ${MAX_ATTEMPTS} attempts."
        exit 1

    - name: Upload emulator host log on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: emulator-host-log-${{ github.job }}-${{ strategy.job-index }}
        path: |
          /tmp/emulator-host-*.log
          /tmp/resource-diag.log
          /tmp/dmesg.log
          /tmp/stall-capture.log
        if-no-files-found: ignore
