name: SSH Debug Runner

# Standalone, on-demand runner for reproducing a specific automated-tests-*
# job's environment under an SSH (tmate) session - decoupled from ci.yml so
# it never runs the full matrix/job graph and never shares ci.yml's
# concurrency group (so it can't cancel, or be cancelled by, a real CI run
# on the same branch).

on:
  workflow_dispatch:
    inputs:
      job-type:
        description: Which job's environment/script to reproduce
        type: choice
        options:
          - automated-tests
          - automated-tests-playstore
          - automated-tests-branded-apps
          - automated-tests-on-tablet
        default: automated-tests-branded-apps
      api-level:
        description: API level to boot
        type: choice
        options: ["25", "30", "33", "34", "35", "36"]
        default: "33"
      run-instrumentation:
        description: Run the actual instrumentation script first (to try to reproduce a hang/failure), instead of just booting and opening a shell
        type: boolean
        default: true

env:
  JAVA_VERSION: 21

jobs:
  debug:
    name: SSH Debug (${{ inputs.job-type }}, ${{ inputs.api-level }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # No exact run-id key to hit here (this workflow never saves one) -
      # fall back straight to the prefix match, same as the assemble job's
      # own restore-keys. A miss just means a slower cold build, not a
      # failure.
      - name: Restore shared Gradle build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-
          restore-keys: |
            gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Mirrors each ci.yml job's own assemble step, so the right debug/
      # androidTest APKs exist regardless of whether the cache above hit.
      - name: Pick assemble command and instrumentation script
        id: pick
        run: |
          case "${{ inputs.job-type }}" in
            automated-tests-playstore)
              echo 'assemble=:app:assembleDebug :app:assembleDebugAndroidTest -PtestingMinimizedBuild' >> "$GITHUB_OUTPUT"
              echo 'script=bash contrib/instrumentation-release.sh' >> "$GITHUB_OUTPUT"
              ;;
            automated-tests-branded-apps)
              echo 'assemble=:branded:assembleCustomexampleDebugAndroidTest' >> "$GITHUB_OUTPUT"
              echo 'script=bash contrib/instrumentation-brandedapps.sh' >> "$GITHUB_OUTPUT"
              ;;
            automated-tests-on-tablet)
              echo 'assemble=:app:assembleDebugAndroidTest' >> "$GITHUB_OUTPUT"
              echo 'script=bash contrib/instrumentation-file-opening-on-tablet.sh' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'assemble=:app:assembleDebugAndroidTest' >> "$GITHUB_OUTPUT"
              echo 'script=bash contrib/instrumentation.sh' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Assemble
        run: ./gradlew ${{ steps.pick.outputs.assemble }}

      # timeout-minutes here is deliberately short: it's what guarantees the
      # tmate step below still opens promptly if this step hangs exactly
      # like the one being investigated, instead of running until this job's
      # own 60-minute cap.
      - name: Boot emulator (and optionally run instrumentation)
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: ${{ inputs.api-level }}
          target: default
          arch: ${{ (inputs.api-level >= '30') && 'x86_64' || 'x86' }}
          profile: pixel_2
          ram-size: 4096M
          cores: 4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ${{ inputs.run-instrumentation && steps.pick.outputs.script || 'echo "Emulator ready - opening shell."' }}

      - name: Debug session (tmate)
        uses: mxschmitt/action-tmate@v3
        if: always()
        timeout-minutes: 30
