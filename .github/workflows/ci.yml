      - name: Upload Lint Reports
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: detekt-report
          path: '**/build/reports/detekt'

  lint:
    name: Lint
    needs: assemble
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore shared Gradle build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-${{ github.run_id }}

      - name: Run Debug Lint
        run: ./gradlew app:lintDebug branded:lintCustomexampleDebug

      - name: Upload Lint Reports
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*'

  # Non-debug variants (assemble only builds assembleDebug - see that job's
  # own comment). Runs alongside everything else, on no critical path.
  # Own artifact name: two jobs can't upload to the same one concurrently.
  assemble-other-variants:
    name: Assemble Release/PlayStore/Standalone/Nightly
    runs-on: ubuntu-26.04
    continue-on-error: true
    env:
      APK_BUILD: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build release, playStore, standalone and nightly configurations
        run: ./gradlew assembleRelease assemblePlayStore assembleStandalone assembleNightly

      - name: Upload APK as Artifacts
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: kiwix-android-other-variants
          path: '**/*.apk'

  assemble:
    name: Assemble for test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    # job-level timeout-minutes can't read the env context (only step-level
    # can), so this can't reference EMULATOR_STEP_TIMEOUT_MINUTES - keep the
    # literal in sync with it by hand.
    timeout-minutes: 180
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: 'gradle'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Restore shared Gradle build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-${{ github.run_id }}
          restore-keys: |
            gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-

      - name: Build all configurations
        run: ./gradlew assembleDebug

      - name: Upload APK as Artifacts
        uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: kiwix-android
          path: |
            **/*.apk

      # Every "Automated tests*" job group below compiles and assembles the
      # same debug + androidTest sources independently per API level - up
      # to 6x redundant per group for output that doesn't vary by API level
      # at all. Build each variant's debug + androidTest APK once here and
      # let Gradle's build cache (org.gradle.caching=true, gradle.properties)
      # do the sharing: restoring this cache before a job's own gradlew
      # invocation makes it skip re-compiling/re-assembling and go straight
      # to install+run, since the task outputs are already present.
      # :app:assembleDebug / :branded:assembleCustomexampleDebug are already
      # covered by "Build all configurations" above - only add what that
      # doesn't build: the androidTest APKs, unit tests, and the separately
      # -PtestingMinimizedBuild-flagged variant (a different Keeper-wrapped
      # config, so it needs its own full assembleDebug).
      - name: Prime build cache for app androidTest (default, tablet)
        run: ./gradlew :app:assembleDebugAndroidTest testDebugUnitTest testCustomexampleDebugUnitTest

      - name: Prime build cache for app debug + androidTest (PlayStore, minimized)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PtestingMinimizedBuild

      - name: Prime build cache for branded androidTest
        run: ./gradlew :branded:assembleCustomexampleDebugAndroidTest

      - name: Save shared Gradle build cache
        uses: actions/cache/save@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-${{ github.run_id }}

      - name: Prune older Gradle build caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key "gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-" \
            --limit 100 --json id,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].id' | \
            xargs -r -n1 gh cache delete

      # setup-java's own cache: 'gradle' (dependency + wrapper caches) has no
      # restore-keys fallback, so a hash change orphans the old entry
      # instead of replacing it - clean those up the same way.
      - name: Prune older setup-java Gradle caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key "setup-java-Linux-x64-gradle-" \
            --limit 100 --json id,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[4:] | .[].id' | \
            xargs -r -n1 gh cache delete
