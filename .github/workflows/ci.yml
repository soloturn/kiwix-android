name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  JAVA_VERSION: 21
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 720
  # Hard cap on each emulator test step so a stuck emulator/teardown fails
  # the job instead of running until the default 6h job timeout.
  EMULATOR_STEP_TIMEOUT_MINUTES: 180

jobs:

  automated-tests:
    name: Automated tests
    needs: assemble
    strategy:
      matrix:
        api-level: [ 25, 30, 33, 34, 35, 36 ]
        target: [ default ]
      fail-fast: true
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          large-packages: false
          swap-storage: false

      - name: Code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Populated by the assemble job's own gradlew runs - lets this job's
      # gradlew invocations skip re-compiling/re-assembling and go straight
      # to install+run.
      - name: Restore shared Gradle build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'buildSrc/src/main/kotlin/Versions.kt') }}-${{ github.run_id }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}

      - name: Create unit test coverage
        if: ${{ matrix.api-level==30 }}
        run: ./gradlew testDebugUnitTest testCustomexampleDebugUnitTest

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ (matrix.api-level >= 30) && 'x86_64' || 'x86' }}
          profile: pixel_2
          ram-size: 4096M
          force-avd-creation: false
          sdcard-path-or-size: 1024M
          cores: 4
          disable-animations: false
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            trap 'killall -INT crashpad_handler 2>/dev/null || true' EXIT
            echo "Generated AVD snapshot for caching."

      - name: Create instrumentation coverage
        uses: ./.github/actions/android-emulator-runner
        timeout-minutes: ${{ fromJSON(env.EMULATOR_STEP_TIMEOUT_MINUTES) }}
        env:
          # Only the primary job's report gets uploaded (see the
          # api-level==30 steps below) - every other level just runs the
          # plain task instead of paying for coverage instrumentation.
          INSTRUMENTATION_GRADLE_TASK: ${{ matrix.api-level == 30 && 'jacocoInstrumentationTestReport' || 'connectedDebugAndroidTest' }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ (matrix.api-level >= 30) && 'x86_64' || 'x86' }}
          profile: pixel_2
          ram-size: 4096M
          cores: 4
          gradle-opts: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.network.retry.max.attempts=6 -Dorg.gradle.internal.network.retry.initial.backOff=2000"
          script: bash contrib/instrumentation.sh

      - name: Upload screenshot result
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ${{ matrix.api-level }}
          path: screencap.png

      - name: Run benchmarks
        if: ${{ matrix.api-level==30 }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.network.retry.max.attempts=6 -Dorg.gradle.internal.network.retry.initial.backOff=2000"
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 3072M
          cores: 4
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          force-avd-creation: false
          heap-size: 1024M
          script: |
            trap 'killall -INT crashpad_handler 2>/dev/null || true' EXIT
            ./gradlew :benchmark:connectedBenchmarkAndroidTest

      - name: Upload coverage to Codecov
        if: ${{ matrix.api-level==30 }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Coverage to GH-Actions
        uses: actions/upload-artifact@v6
        if: ${{ matrix.api-level==30 }}
        with:
          name: Tests Coverage Report
          path: |
            **/reports/

